name: Build A Adventure APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find A Adventure ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname 'A-Adventure-Android.zip' -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "Using ZIP: $ZIP_FILE"
            mkdir -p build-project
            unzip -q "$ZIP_FILE" -d build-project
          else
            echo "A-Adventure-Android.zip not found."
            echo "Using repository as the Android project."
            mkdir -p build-project
            cp -R . build-project/repo-copy
            PROJECT_CANDIDATE=$(find build-project/repo-copy -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
            if [ -z "$PROJECT_CANDIDATE" ]; then
              echo "No Android Gradle project found."
              exit 1
            fi
            mv "$PROJECT_CANDIDATE" build-project/project
          fi

      - name: Find Android project
        shell: bash
        run: |
          set -e
          PROJECT_DIR=$(find build-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build A Adventure APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p output
          find "$PROJECT_DIR" -type f -name '*.apk' -exec cp {} output/A-Adventure-debug.apk \;
          test -f output/A-Adventure-debug.apk

      - name: Upload A Adventure APK
        uses: actions/upload-artifact@v4
        with:
          name: A-Adventure-debug-APK
          path: output/A-Adventure-debug.apk
          if-no-files-found: error
