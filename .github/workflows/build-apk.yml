name: Build A Adventure APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.A_ADVENTURE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.A_ADVENTURE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.A_ADVENTURE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.A_ADVENTURE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: A_ADVENTURE_KEYSTORE_BASE64 is empty."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: A_ADVENTURE_STORE_PASSWORD is empty."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: A_ADVENTURE_KEY_ALIAS is empty."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: A_ADVENTURE_KEY_PASSWORD is empty."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/a-adventure-release.jks"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "A_ADVENTURE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "A_ADVENTURE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "A_ADVENTURE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "A_ADVENTURE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify signing key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.A_ADVENTURE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets
