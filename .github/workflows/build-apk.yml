name: Build A Adventure APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.A_ADVENTURE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: A_ADVENTURE_KEYSTORE_BASE64 is empty."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/a-adventure-release.jks"

          if [ ! -s "$RUNNER_TEMP/a-adventure-release.jks" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "A_ADVENTURE_KEYSTORE_PATH=$RUNNER_TEMP/a-adventure-release.jks" >> "$GITHUB_ENV"

      - name: Verify signing key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.A_ADVENTURE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.A_ADVENTURE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.A_ADVENTURE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/a-adventure-release.jks"

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: A_ADVENTURE_STORE_PASSWORD is empty."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: A_ADVENTURE_KEY_ALIAS is empty."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: A_ADVENTURE_KEY_PASSWORD is empty."
            exit 1
          fi

          echo "Checking keystore password..."

          if ! keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            >/dev/null 2>&1; then
            echo "ERROR: A_ADVENTURE_STORE_PASSWORD is incorrect."
            exit 1
          fi

          echo "Keystore password: OK"
          echo "Checking key alias..."

          if ! keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null 2>&1; then
            echo "ERROR: A_ADVENTURE_KEY_ALIAS is incorrect."
            exit 1
          fi

          echo "Key alias: OK"
          echo "Checking key password..."

          cat > "$RUNNER_TEMP/VerifyKey.java" <<'EOF'
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;

          public class VerifyKey {
              public static void main(String[] args) throws Exception {
                  String file = args[0];
                  String storePass = args[1];
                  String alias = args[2];
                  String keyPass = args[3];

                  KeyStore ks = KeyStore.getInstance(KeyStore.getDefaultType());

                  try (FileInputStream in = new FileInputStream(file)) {
                      ks.load(in, storePass.toCharArray());
                  }

                  Key key = ks.getKey(alias, keyPass.toCharArray());

                  if (key == null) {
                      throw new Exception("Key could not be read.");
                  }

                  System.out.println("Key password: OK");
              }
          }
          EOF

          javac "$RUNNER_TEMP/VerifyKey.java"

          java -cp "$RUNNER_TEMP" VerifyKey \
            "$KEYSTORE" \
            "$STORE_PASSWORD" \
            "$KEY_ALIAS" \
            "$KEY_PASSWORD"

      - name: Build signed release APK
        env:
          A_ADVENTURE_STORE_PASSWORD: ${{ secrets.A_ADVENTURE_STORE_PASSWORD }}
          A_ADVENTURE_KEY_ALIAS: ${{ secrets.A_ADVENTURE_KEY_ALIAS }}
          A_ADVENTURE_KEY_PASSWORD: ${{ secrets.A_ADVENTURE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          echo "SIGNED RELEASE APK: OK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: A-Adventure-0.1.1
