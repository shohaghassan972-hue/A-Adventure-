name: Build A Adventure APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.A_ADVENTURE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.A_ADVENTURE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.A_ADVENTURE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.A_ADVENTURE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Required Android signing secrets are missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/a-adventure-release.jks"
          test -s "$RUNNER_TEMP/a-adventure-release.jks"

          echo "A_ADVENTURE_KEYSTORE_PATH=$RUNNER_TEMP/a-adventure-release.jks" >> "$GITHUB_ENV"
          echo "A_ADVENTURE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "A_ADVENTURE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "A_ADVENTURE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify signing key before Gradle build
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.A_ADVENTURE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.A_ADVENTURE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.A_ADVENTURE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/a-adventure-release.jks"

          echo "Checking keystore file..."
          test -s "$KEYSTORE_PATH"

          echo "Checking keystore password and alias..."
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "Keystore password and alias: OK"

          echo "Checking private-key password..."
          rm -f "$RUNNER_TEMP/signing-key-check.p12"

          keytool -importkeystore \
            -srckeystore "$KEYSTORE_PATH" \
            -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/signing-key-check.p12" \
            -deststoretype PKCS12 \
            -deststorepass "__temporary_check_password__" \
            -destkeypass "__temporary_check_password__" \
            -noprompt >/dev/null

          echo "Private-key password: OK"

          rm -f "$RUNNER_TEMP/signing-key-check.p12"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK is signed
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK_PATH"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --
