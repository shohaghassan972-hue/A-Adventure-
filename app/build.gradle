
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aadventure.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aadventure.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.1"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('A_ADVENTURE_KEYSTORE_PATH')
            def storePasswordValue = System.getenv('A_ADVENTURE_STORE_PASSWORD')
            def keyAliasValue = System.getenv('A_ADVENTURE_KEY_ALIAS')
            def keyPasswordValue = System.getenv('A_ADVENTURE_KEY_PASSWORD')

            if (keystorePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(keystorePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
